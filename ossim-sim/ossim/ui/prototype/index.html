function parseWorkload(text){
  const errs=[], rows=[], seen=new Set();
  const lines=text.replace(/\r/g,"").split("\n").filter(l=>l.trim()!=="");
  if(!lines.length) return {rows, errs:["Workload is empty"]};
  if(lines[0].replace(/\s/g,"")!=="pid,arrival,burst,priority") return {rows, errs:["Line 1: header must be pid,arrival,burst,priority"]};
  lines.slice(1).forEach((ln,i)=>{ const n=i+2, c=ln.split(",").map(x=>x.trim());
    if(c.length!==4){errs.push(`Line ${n}: wrong number of fields (need 4, found ${c.length})`);return}
    if(!/^[A-Za-z0-9_-]{1,31}$/.test(c[0])){errs.push(`Line ${n}: invalid pid "${c[0]}"`);return}
    if(seen.has(c[0])){errs.push(`Line ${n}: duplicate pid ${c[0]}`);return}
    if(![c[1],c[2],c[3]].every(v=>/^-?\d+$/.test(v))){errs.push(`Line ${n}: arrival, burst and priority must be integers`);return}
    const a=+c[1],b=+c[2],p=+c[3];
    if(a<0||b<=0||p<0){errs.push(`Line ${n}: arrival >= 0, burst > 0, priority >= 0 required`);return}
    seen.add(c[0]); rows.push({pid:c[0],arrival:a,burst:b,priority:p}); });
  if(!errs.length && !rows.length) errs.push("No processes");
  return {rows, errs};
}

function parseInt3(){
  const errs=[], S=INTSTATE;
  const traces={}; S.traces.split("\n").forEach((ln,i)=>{ const t=ln.trim(); if(!t||t.startsWith("#")) return; const m=t.match(/^([A-Za-z0-9_-]+)\s*:\s*(.*)$/);
    if(!m){ errs.push(`Trace line ${i+1}: use  PID: address address ...`); return; } traces[m[1]]=m[2].trim().split(/\s+/).filter(Boolean).join("\n"); });
  const principals={}; S.users.split("\n").forEach((ln,i)=>{ const t=ln.trim(); if(!t||t.startsWith("#")) return; const m=t.match(/^([A-Za-z0-9_-]+)\s*=\s*([A-Za-z0-9_-]+)$/);
    if(!m){ errs.push(`User line ${i+1}: use  PID=user`); return; } principals[m[1]]=m[2]; });
  const requests=[]; S.reqs.split("\n").forEach((ln,i)=>{ const t=ln.trim(); if(!t||t.startsWith("#")) return; const m=t.match(/^(\S+)\s+(\S+)\s+(\S+)\s*(.*)$/);
    if(!m){ errs.push(`Request line ${i+1}: use  PID time_ms command arguments`); return; }
    const [,pid,at,cmd,rest]=m, at_ms=parseFloat(at); if(!isFinite(at_ms)||at_ms<0){ errs.push(`Request line ${i+1}: time must be a number of ms, 0 or more`); return; }
    let args=[]; if(cmd==="write"||cmd==="append"){ const mm=rest.match(/^(\S+)\s*(.*)$/); args=mm?[mm[1],mm[2].trim().replace(/^"|"$/g,"")]:[]; } else if(rest.trim()) args=[rest.trim()];
    requests.push({pid,cmd,args,at_ms}); });
  const flt=msToTicks(parseFloat(S.lat),"Fault time",errs);
  return {errs, body:{csv:S.procs,policy:S.policy,q:4,cs:0,aging:0,seed:0,preemptive:S.policy==="srtf",
    memory:{traces,page_size:4096,frames:3,policy:"lru",hit_ticks:1,fault_ticks:flt,interval_ticks:10},
    files:{requests,principals,setup:[{path:"/",mode:"775",group:"staff"}]}}};
}
async function intRun(){

}
function intChart(){
  const p=INT.process.snapshot, pids=Object.keys(p.per_process).sort(), lastBlock=Math.max(0,...INT.blocked.map(b=>b.end));
  const T=Math.max(p.makespan,lastBlock)/10, L=44, W=760, R=12, lane=40, H=24+pids.length*lane+26, x=ms=>L+ms/T*(W-L-R);
  const step=T<=20?2:T<=60?5:10; let svg=`<svg role="img" aria-label="Process lanes: when each process ran and when it was blocked by page faults or file requests" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="background:#fff;border:1px solid var(--line);border-radius:6px"><title>Running and blocked time per process</title>
   <defs><pattern id="hm" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><rect width="3" height="6" fill="#c76a00"/></pattern>
   <pattern id="hf" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><rect width="6" height="6" fill="#fff"/><rect width="3" height="6" fill="#2f6fdb"/></pattern></defs>`;
  for(let t=0;t<=T+1e-9;t+=step) svg+=`<line x1="${x(t)}" x2="${x(t)}" y1="16" y2="${H-24}" stroke="#e5e8ee"/><text x="${x(t)}" y="${H-8}" font-size="11" text-anchor="middle" fill="#5d6676">${t}</text>`;
  svg+=`<text x="${W-R}" y="${H-8}" font-size="11" text-anchor="end" fill="#5d6676">ms</text>`;
  pids.forEach((pid,i)=>{ const y=22+i*lane; svg+=`<text x="4" y="${y+11}" font-size="12" font-weight="700">${esc(pid)}</text><text x="4" y="${y+23}" font-size="9" fill="#5d6676">run</text>`;
    p.gantt.filter(g=>g.pid===pid).forEach(g=>{ svg+=`<rect x="${x(g.start/10)}" y="${y}" width="${Math.max(1,x(g.end/10)-x(g.start/10))}" height="12" fill="#1d2330"><title>${esc(pid)} running ${g.start/10}-${g.end/10} ms</title></rect>`; });
    INT.blocked.filter(b=>b.pid===pid).forEach(b=>{ const mem=b.source==="memory"; svg+=`<rect x="${x(b.start/10)}" y="${y+(mem?14:25)}" width="${Math.max(1.5,x(b.end/10)-x(b.start/10))}" height="9" fill="url(#${mem?"hm":"hf"})" stroke="${mem?"#c76a00":"#2f6fdb"}"><title>${esc(pid)} blocked (${b.reason}) ${b.start/10}-${b.end/10} ms</title></rect>`; }); });
  return svg+`</svg><div class="legend"><span class="lg"><i style="background:#1d2330"></i>running on the CPU</span><span class="lg"><i style="background:repeating-linear-gradient(45deg,#fff,#fff 2px,#c76a00 2px,#c76a00 4px);border:1px solid #c76a00"></i>blocked: page fault</span><span class="lg"><i style="background:repeating-linear-gradient(-45deg,#fff,#fff 2px,#2f6fdb 2px,#2f6fdb 4px);border:1px solid #2f6fdb"></i>blocked: file request</span></div>`;
}

  for(const pol of ["fifo","lru"]){ const k=pol.toUpperCase(); prog.textContent="Running memory "+k+"..."; const r=await post("/api/memory/run",{...MEMBODY,trace:TRACE_BASE,policy:pol}); const e=E[k];
    const got=(r.j.snapshot?r.j.snapshot.results.join(""):""), want=e.results.join(""); const ok=r.ok&&got===want&&mv(r.j.metrics,"faults")===e.faults&&mv(r.j.metrics,"evictions")===e.evictions;
    add(`T-MEM-0${pol==="fifo"?2:3} ${k} on the baseline trace`,"Unit: memory",ok,`${want}; ${e.faults} faults, ${e.evictions} evictions`,r.ok?`${got}; ${mv(r.j.metrics,"faults")} faults, ${mv(r.j.metrics,"evictions")} evictions`:(r.j.errors||[]).join(" | "),ok?"matches the hand-calculated values":"differs from the hand-calculated values"); }
  prog.textContent="Running memory comparison..."; const c=await post("/api/memory/compare",{...MEMBODY,trace:TRACE_LOC,policy:"fifo"});
  const okc=c.ok&&mv(c.j.runs.fifo.metrics,"faults")===12&&mv(c.j.runs.lru.metrics,"faults")===8;
  add("T-MEM-04 Locality trace: LRU beats FIFO","Unit: memory",okc,"FIFO 12 faults, LRU 8 faults (worked by hand)",c.ok?`FIFO ${mv(c.j.runs.fifo.metrics,"faults")}, LRU ${mv(c.j.runs.lru.metrics,"faults")}`:(c.j.errors||[]).join(" | "),okc?"both policies ran on the identical trace":"differs from the hand-worked values");
  prog.textContent="Running file baseline..."; const fb=await post("/api/file/run",{script:FS_BASE}); const steps=EXP.file.steps;
  const log=fb.ok?fb.j.snapshot.log:[]; const okf=fb.ok&&log.length===steps.length&&log.every((h,i)=>h.ok===steps[i].ok&&(h.ok?h.output:h.error)===(steps[i].ok?steps[i].output:steps[i].error));
  add("T-FILE-02 Baseline 12-command script","Unit: file",okf,`${steps.length} steps; 9 ok, 3 errors; tree empty at the end`,fb.ok?`${log.length} steps; ${mv(fb.j.metrics,"succeeded")} ok, ${mv(fb.j.metrics,"failed")} errors; ${fb.j.snapshot.tree.children.length} items left`:(fb.j.errors||[]).join(" | "),okf?"every step matches expected_results/file_baseline.json":"a step differs from the expected result");
  const fs=await post("/api/file/run",{script:FS_SAMPLE}); const m=fs.ok?fs.j.metrics:null;

  add("T-FILE-03 20-command script with 5 safe errors","Unit: file",okg,"20 commands; 15 ok, 5 errors; 15 B written, 14 B read; storage 0 B",m?`${mv(m,"operations")} commands; ${mv(m,"succeeded")} ok, ${mv(m,"failed")} errors; ${mv(m,"bytes_written")} B written, ${mv(m,"bytes_read")} B read; storage ${mv(m,"storage_used")} B`:(fs.j.errors||[]).join(" | "),okg?"matches the hand-worked values":"differs from the hand-worked values");
  prog.textContent="Running integration..."; const ib=parseIntDefaults(); const ir=await post("/api/integration/run",ib); const pp=ir.ok?ir.j.per_process:null;
  const oki=ir.ok&&pp.P1.faults===6&&pp.P2.faults===3&&ir.j.file.metrics.denied.value===3&&ir.j.file.metrics.succeeded.value===5;
  add("T-INT-02 Process refs + authorized file requests","Integration",oki,"P1 6 faults, P2 3 faults; file requests: 5 ok, 3 denied",ir.ok?`P1 ${pp.P1.faults} faults, P2 ${pp.P2.faults} faults; ${ir.j.file.metrics.succeeded.value} ok, ${ir.j.file.metrics.denied.value} denied`:(ir.j.errors||[]).join(" | "),oki?"blocked then ready; denied requests logged":"differs from the hand-worked values");
  const bad=[["T-INV-04 Memory: zero frames","/api/memory/run",{...MEMBODY,trace:TRACE_BASE,frames:0},"frames must be"],["T-INV-05 Memory: bad address","/api/memory/run",{...MEMBODY,trace:"0x10\nzzz\n"},"not a decimal or hex address"],
    ["T-INV-06 File: unknown command","/api/file/run",{script:"format /\n"},"unknown command"],["T-INV-07 Integration: unknown process","/api/integration/run",{...parseIntDefaults(),memory:{traces:{P9:"0x0"}},files:{}},"not in the workload"]];
