<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OS Simulator Dashboard — Milestone 1 Prototype</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#1d2330;--muted:#5d6676;--line:#d9dde4;--acc:#2f6fdb;--ok:#1f8a4c;--warn:#b26a00;--bad:#c23b3b;
--p1:#2f6fdb;--p2:#e0702b;--p3:#1d9e74;--p4:#b8860b;--cs:#555;--idle:#bbb}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#162033;color:#fff;flex-wrap:wrap}
header h1{font-size:16px;margin:0 12px 0 0}header .ctl button,header select,header input{font:inherit;padding:5px 10px;border-radius:6px;border:1px solid #3b4a66;background:#22304a;color:#fff}
header .ctl button:focus-visible,nav button:focus-visible,main button:focus-visible{outline:3px solid #ffbf47;outline-offset:2px}
header .state{margin-left:auto;font-size:13px;opacity:.9}
.wrap{display:flex;min-height:calc(100vh - 52px)}
nav{width:210px;background:#fff;border-right:1px solid var(--line);padding:10px 8px;flex-shrink:0}
nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 8px 4px}
nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;font:inherit;color:var(--ink);cursor:pointer}
nav button[aria-current=page]{background:#e7efff;color:var(--acc);font-weight:600}
main{flex:1;padding:18px 22px;min-width:0}
h2{margin:0 0 4px;font-size:20px}.sub{color:var(--muted);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card h3{margin:0 0 6px;font-size:14px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start}
.badge{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid}
.b-ok{color:var(--ok);border-color:var(--ok)}.b-warn{color:var(--warn);border-color:var(--warn)}.b-todo{color:var(--muted);border-color:var(--line)}
table{border-collapse:collapse;width:100%;background:#fff}th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;font-size:13px}th{background:#f0f2f6}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
select,input[type=number],input[type=text]{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
.btn{font:inherit;padding:6px 12px;border-radius:6px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
.btn.ghost{background:#fff;color:var(--acc)}
.note{background:#fff8e6;border:1px solid #f0d58a;border-radius:8px;padding:8px 12px;margin:10px 0;font-size:13px}
.gantt{position:relative;height:46px;border:1px solid var(--line);background:#fff;border-radius:6px;margin:6px 0 22px}
.seg{position:absolute;top:0;bottom:0;color:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;border-right:1px solid #fff}
.tick{position:absolute;top:48px;font-size:11px;color:var(--muted);transform:translateX(-50%)}
.frames td.f{background:#ffecec}.frames td.h{background:#e9f7ef}
.tabs button{font:inherit;padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:6px 6px 0 0;cursor:pointer}
.tabs button[aria-selected=true]{border-bottom-color:#fff;font-weight:600;color:var(--acc)}
.tree{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.err{color:var(--bad);font-size:13px;margin-top:4px}
.bar{height:18px;background:var(--acc);border-radius:3px}
#toast{position:fixed;bottom:16px;right:16px;background:#162033;color:#fff;padding:10px 14px;border-radius:8px;opacity:0;transition:.2s;max-width:340px}
#toast.show{opacity:1}
.sr{position:absolute;left:-9999px}
</style></head><body>
<header>
 <h1>OS Simulator</h1>
 <div class="ctl" role="toolbar" aria-label="Simulation controls">
  <button data-act="Run">▶ Run</button> <button data-act="Pause">⏸ Pause</button> <button data-act="Step">⏭ Step</button> <button data-act="Reset">↺ Reset</button>
  <label class="sr" for="speed">Speed</label><select id="speed"><option>1×</option><option>2×</option><option>5×</option><option>Max</option></select>
  <label class="sr" for="seed">Seed</label><input id="seed" type="number" value="42" style="width:80px;background:#22304a;color:#fff;border-color:#3b4a66" aria-label="Seed">
  <select aria-label="Stop condition"><option>Stop: all done</option><option>Stop: t = 100 ms</option><option>Stop: 1000 events</option></select>
  <button data-act="Batch">Batch…</button>
 </div>
 <div class="state">Scenario: <b>baseline-01</b> · t = <b id="clock">0.0</b> ms · State: <b id="runstate">Ready</b></div>
</header>

 <button data-page="compare">Comparison center</button><button data-page="events">Event explorer</button><button data-page="export">Export</button>
</nav>
<main id="main" tabindex="-1"></main>
</div>

 <table><tr><th>Test</th><th>Suite</th><th>Status</th><th>Expected</th><th>Actual</th><th>Diagnostics</th></tr>

compare: () => { const rows=Object.entries(ALGS).map(([k,v])=>[v,EXP.process.algorithms[k].averages]); const mx=Math.max(...rows.map(r=>r[1].waiting));
 return `<h2>Comparison center</h2><p class="sub">Same input, several policies, side by side</p>${protoNote("expected values for the baseline workload, cs = 0.")}
 <table><tr><th>Policy</th><th>Avg waiting (ms)</th><th>Avg turnaround (ms)</th><th>Avg response (ms)</th><th style="width:35%">Avg waiting (bar)</th></tr>
 ${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1].waiting.toFixed(2)}</td><td>${r[1].turnaround.toFixed(2)}</td><td>${r[1].response.toFixed(2)}</td><td><div class="bar" style="width:${r[1].waiting/mx*100}%" aria-hidden="true"></div></td></tr>`).join("")}</table>`},
events: () => `<h2>Event explorer</h2><p class="sub">Filter by time, manager, entity, event, outcome, severity, correlation ID</p>
 ${protoNote("sample rows show the event schema; they are not simulator output.")}
 <div class="row" style="margin-bottom:10px"><input type="text" placeholder="Search…" aria-label="Search"><select aria-label="Manager"><option>All managers</option><option>process</option><option>memory</option><option>file</option><option>security</option><option>device</option><option>network</option><option>parallel</option></select>
 <select aria-label="Outcome"><option>Any outcome</option><option>ok</option><option>denied</option><option>failed</option><option>error</option></select><select aria-label="Severity"><option>Any severity</option><option>info</option><option>warning</option><option>critical</option></select><input type="text" placeholder="Correlation ID" aria-label="Correlation ID"></div>
 <table><tr><th>seq</th><th>t (ms)</th><th>Manager</th><th>Event</th><th>Entity</th><th>Prev → new</th><th>Outcome</th><th>Severity</th><th>Correlation</th><th>Message</th></tr>
 <tr><td>1</td><td>0.0</td><td>process</td><td>ARRIVE</td><td>P1</td><td>new → ready</td><td>ok</td><td>info</td><td>baseline-01</td><td>sample</td></tr>
 <tr><td>2</td><td>0.0</td><td>process</td><td>DISPATCH</td><td>P1</td><td>ready → running</td><td>ok</td><td>info</td><td>baseline-01</td><td>sample</td></tr>
 <tr><td>3</td><td>1.0</td><td>security</td><td>AUTHORIZE</td><td>bob:/docs/notes.txt</td><td>— → —</td><td>denied</td><td>warning</td><td>P2-fs-1</td><td>sample: write denied</td></tr></table>`,
export: () => `<h2>Export</h2><p class="sub">Save configuration, event log, per-manager CSV, charts and summary (no host data)</p>
 <div class="grid">${["Configuration (JSON)","Event log (CSV / JSON)","Process metrics (CSV)","Memory results (CSV)","File log (CSV)","Charts (SVG/PNG)","Summary report (Markdown)"].map(x=>`<div class="card"><h3>${x}</h3><button class="btn ghost" onclick="toast('Export: Milestone 2+')">Export</button></div>`).join("")}</div>`
};
const TABS=[
 ()=>`<table><tr><th>PID</th><th>Arrival</th><th>Burst</th><th>Priority</th></tr>${PROC.map(r=>`<tr>${r.map(c=>`<td contenteditable="true">${c}</td>`).join("")}</tr>`).join("")}</table>
   <div class="row" style="margin-top:8px"><button class="btn ghost" id="addrow">+ Add process</button><button class="btn" id="validate">Validate</button></div><div id="verr" role="alert"></div>`,
 ()=>`<label for="tr">Addresses (hex or decimal, one per line)</label><textarea id="tr" rows="6" cols="30">0x0040\n0x10A0\n0x0044\n0x20B0</textarea>`,
 ()=>`<label for="fsx">Commands</label><textarea id="fsx" rows="6" cols="50">mkdir /docs\nmkfile /docs/notes.txt\nwrite /docs/notes.txt "Hello"</textarea>`,
 ()=>`<p>Users, roles and rwx grants. <span class="badge b-todo">Milestone 4</span></p>`,
 ()=>`<p>Device, request time, cylinder, owning process. <span class="badge b-todo">Milestone 4</span></p>`,
 ()=>`<p>Nodes, links (bandwidth, delay, cost), packets. <span class="badge b-todo">Milestone 4</span></p>`,
 ()=>`<p>At time t: device offline / link down / recover. <span class="badge b-todo">Milestone 4</span></p>`];
function show(page){
  document.querySelectorAll("nav button").forEach(b=>{ if(b.dataset.page===page) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  $("#main").innerHTML=PAGES[page](); $("#main").focus();
  if(page==="process"){ $("#prun").onclick=()=>{const k=$("#alg").value,r=EXP.process.algorithms[k];
     if(+$("#cs").value<0){toast("Context-switch cost cannot be negative");return}
     $("#pout").innerHTML=`<h3 style="margin-top:16px">${ALGS[k]}: CPU Gantt chart (ms)</h3>`+gantt(r.gantt,r.makespan)+ptable(r)+`<p class="sub">Makespan ${r.makespan} ms · CPU utilization ${r.cpu_utilization_pct}% · idle ${r.idle} ms · context-switch time ${r.context_switch_time} ms</p>`; }; $("#prun").click(); }
  if(page==="memory"){ $("#mrun").onclick=()=>{const m=EXP.memory, r=m[$("#mp").value]; const fr=[];let rows="";
     m.pages.forEach((p,i)=>{ if(r.results[i]==="F"){ if(r.evicted[i]!==null) fr.splice(fr.indexOf(r.evicted[i]),1,p); else fr.push(p);} 
       rows+=`<tr><td>${i+1}</td><td>0x${[0x0040,0x10A0,0x0044,0x20B0,0x3010,0x0048,0x10A4,0x4000,0x0050,0x20B4][i].toString(16).toUpperCase().padStart(4,"0")}</td><td>${p}</td>${[0,1,2].map(j=>`<td>${fr[j]??""}</td>`).join("")}<td class="${r.results[i]==="H"?"h":"f"}">${r.results[i]==="H"?"Hit":"Fault"}</td><td>${r.evicted[i]??""}</td></tr>`;});
     $("#mout").innerHTML=`<table class="frames" style="margin-top:12px"><tr><th>#</th><th>Address</th><th>Page</th><th>Frame 0</th><th>Frame 1</th><th>Frame 2</th><th>Result</th><th>Evicted</th></tr>${rows}</table>
     <p class="sub">${r.hits} hits · ${r.faults} faults · ${r.evictions} evictions · fault rate ${(r.fault_rate*100).toFixed(0)}% · avg access ${r.avg_access_ms.toFixed(2)} ms</p>`;}; $("#mrun").click(); }
  if(page==="scenario"){ const sel=i=>{document.querySelectorAll("[role=tab]").forEach(t=>t.setAttribute("aria-selected",t.dataset.tab==i)); $("#tabbody").innerHTML=TABS[i]();
     if(i==0){ $("#addrow").onclick=()=>{$("#tabbody table").insertAdjacentHTML("beforeend",`<tr><td contenteditable>P5</td><td contenteditable>4</td><td contenteditable>-2</td><td contenteditable>1</td></tr>`)};
       $("#validate").onclick=()=>{const errs=[],seen=new Set();[...$("#tabbody table").rows].slice(1).forEach((tr,i)=>{const c=[...tr.cells].map(x=>x.textContent.trim());
         if(seen.has(c[0]))errs.push(`Row ${i+1}: duplicate PID ${c[0]}`);seen.add(c[0]);
         if(!/^-?\d+$/.test(c[1])||+c[1]<0)errs.push(`Row ${i+1}: arrival must be an integer ≥ 0`);
         if(!/^-?\d+$/.test(c[2])||+c[2]<=0)errs.push(`Row ${i+1}: burst must be an integer > 0`);});
         $("#verr").innerHTML=errs.length?errs.map(e=>`<div class="err">✗ ${e}</div>`).join(""):`<div style="color:var(--ok)">✓ Valid. Nothing was changed until you save.</div>`;};}};
     document.querySelectorAll("[role=tab]").forEach(t=>t.onclick=()=>sel(+t.dataset.tab)); sel(0); }
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.page));
show("overview");
</script></body></html>
