// Client-side workload validation: same rules and wording style as ossim/io/loaders.py
function parseWorkload(text){
  const errs=[], rows=[], seen=new Set();
  const lines=text.replace(/\r/g,"").split("\n").filter(l=>l.trim()!=="");
  if(!lines.length) return {rows, errs:["Workload is empty"]};
  if(lines[0].replace(/\s/g,"")!=="pid,arrival,burst,priority") return {rows, errs:["Line 1: header must be pid,arrival,burst,priority"]};
  lines.slice(1).forEach((ln,i)=>{ const n=i+2, c=ln.split(",").map(x=>x.trim());
    if(c.length!==4){errs.push(`Line ${n}: wrong number of fields (need 4, found ${c.length})`);return}
    if(!/^[A-Za-z0-9_-]{1,31}$/.test(c[0])){errs.push(`Line ${n}: invalid pid "${c[0]}"`);return}
    if(seen.has(c[0])){errs.push(`Line ${n}: duplicate pid ${c[0]}`);return}
    if(![c[1],c[2],c[3]].every(v=>/^-?\d+$/.test(v))){errs.push(`Line ${n}: arrival, burst and priority must be integers`);return}
    const a=+c[1],b=+c[2],p=+c[3];
    if(a<0||b<=0||p<0){errs.push(`Line ${n}: arrival >= 0, burst > 0, priority >= 0 required`);return}
    seen.add(c[0]); rows.push({pid:c[0],arrival:a,burst:b,priority:p}); });
  if(!errs.length && !rows.length) errs.push("No processes");
  return {rows, errs};
}

}
function cfgErrors(c){
  const e=[]; if(!(c.q>=1)) e.push("Quantum must be at least 1 ms"); if(c.cs<0) e.push("Context-switch cost cannot be negative");
  if(c.aging<0) e.push("Aging interval cannot be negative"); if(!Number.isInteger(c.seed)) e.push("Seed must be an integer");
  if(Math.round(c.cs*10)!==c.cs*10 && Math.abs(c.cs*10-Math.round(c.cs*10))>1e-9) e.push("Context switch must be a multiple of 0.1 ms");
  return e;
}

      tbl+=`<tr><td>${p}</td><td>${fin[st]||st}</td><td>${t}</td><td>${nt}</td></tr>`;
      h+=`<div class="tl ${st}" style="left:${t/end*100}%;width:${w}%" title="${p} ${fin[st]||st} ${t}-${nt} ms">${w>6?(st==="running"?"RUN":"wait"):""}</div>`; });
    rows+=`<div class="lane"><span class="lname">${p}</span><div class="ltrack" role="img" aria-label="${p} state timeline">${h}</div></div>`; }

   <details><summary>Text version of the timeline</summary><table><tr><th>PID</th><th>State</th><th>From (ms)</th><th>To (ms)</th></tr>${tbl}</table></details>`;
}
function ganttN(segs,total,order){

  if(!RUN){ CUR=0; if(!(await loadRun())) return; }
  const n=RUN.events.length;
  if(act==="Step"){ stopTimer(); if(CUR<n) CUR++; sync(); setState(CUR>=n?endState():"Paused"); return; }
  if(act==="Run"){ stopTimer(); const sp=$("#speed").value; if(CUR>=n && n>0) CUR=0;

}

    const r=await post("/api/process/run",{csv:DEFAULT_CSV,q:4,cs:0,aging:0,seed:0,...c}); const n=normalize(r.j.snapshot);

  if(page==="process"){ wireProcess(); }
  if(page==="overview"){ engineStatus().then(()=>{const e=$("#ov-proc"); if(e) e.textContent=ENGINE&&ENGINE.engine?"Engine connected":"Engine not connected";}); }
  if(page==="events"){ const f=()=>{const q=($("#evq").value||"").toLowerCase(),t=$("#evt").value; document.querySelectorAll("#evtab tr[data-s]").forEach(r=>{r.style.display=(!q||r.dataset.s.includes(q))&&(!t||r.dataset.t===t)?"":"none"})}; $("#evq").oninput=f; $("#evt").onchange=f; }
  if(page==="testing"){ $("#tcrun").onclick=runChecks; }
  if(page==="memory"){ $("#mrun").onclick=()=>{const m=EXP.memory, r=m[$("#mp").value]; const fr=[];let rows="";
     m.pages.forEach((p,i)=>{ if(r.results[i]==="F"){ if(r.evicted[i]!==null) fr.splice(fr.indexOf(r.evicted[i]),1,p); else fr.push(p);} 
       rows+=`<tr><td>${i+1}</td><td>0x${[0x0040,0x10A0,0x0044,0x20B0,0x3010,0x0048,0x10A4,0x4000,0x0050,0x20B4][i].toString(16).toUpperCase().padStart(4,"0")}</td><td>${p}</td>${[0,1,2].map(j=>`<td>${fr[j]??""}</td>`).join("")}<td class="${r.results[i]==="H"?"h":"f"}">${r.results[i]==="H"?"Hit":"Fault"}</td><td>${r.evicted[i]??""}</td></tr>`;});
     $("#mout").innerHTML=`<table class="frames" style="margin-top:12px"><tr><th>#</th><th>Address</th><th>Page</th><th>Frame 0</th><th>Frame 1</th><th>Frame 2</th><th>Result</th><th>Evicted</th></tr>${rows}</table>
     <p class="sub">${r.hits} hits · ${r.faults} faults · ${r.evictions} evictions · fault rate ${(r.fault_rate*100).toFixed(0)}% · avg access ${r.avg_access_ms.toFixed(2)} ms</p>`;}; $("#mrun").click(); }
  if(page==="scenario"){ const sel=i=>{document.querySelectorAll("[role=tab]").forEach(t=>t.setAttribute("aria-selected",t.dataset.tab==i)); $("#tabbody").innerHTML=TABS[i]();
     if(i==0){ $("#addrow").onclick=()=>{$("#tabbody table").insertAdjacentHTML("beforeend",`<tr><td contenteditable>P5</td><td contenteditable>4</td><td contenteditable>-2</td><td contenteditable>1</td></tr>`)};
       $("#validate").onclick=()=>{const errs=[],seen=new Set();[...$("#tabbody table").rows].slice(1).forEach((tr,i)=>{const c=[...tr.cells].map(x=>x.textContent.trim());
         if(seen.has(c[0]))errs.push(`Row ${i+1}: duplicate PID ${c[0]}`);seen.add(c[0]);
         if(!/^-?\d+$/.test(c[1])||+c[1]<0)errs.push(`Row ${i+1}: arrival must be an integer ≥ 0`);
         if(!/^-?\d+$/.test(c[2])||+c[2]<=0)errs.push(`Row ${i+1}: burst must be an integer > 0`);});
         $("#verr").innerHTML=errs.length?errs.map(e=>`<div class="err">✗ ${e}</div>`).join(""):`<div style="color:var(--ok)">✓ Valid. Nothing was changed until you save.</div>`;};}};
     document.querySelectorAll("[role=tab]").forEach(t=>t.onclick=()=>sel(+t.dataset.tab)); sel(0); }
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>show(b.dataset.page));
show("overview");
</script></body></html>
